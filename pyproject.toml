[project]
name = "shahrzad"
version = "1.0.0"
description = "Shahrzad — agentic English to Persian literary translator for a personal library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "lxml>=5.2",
  "python-docx>=1.1",
  "pypdfium2>=4.30",
  "rapidfuzz>=3.9",
  "tenacity>=8.3",
  "litellm>=1.40",
  "python-dotenv>=1.0",
]

[project.scripts]
shz = "shahrzad.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml>=6.0",
  "hypothesis>=6.100",
  "reportlab>=4.1",
  "fonttools[woff]>=4.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shahrzad"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "ARG", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # size guards that hurt clarity
  "B008",  # typer uses function calls in defaults
  "E501",  # the spec is denser than 100 columns in places; formatting stays readable
  "PLC0415",  # deliberate lazy imports keep litellm and heavy modules optional
  "ARG001", "ARG002", "ARG003",  # Protocol implementations keep the full signature
  "UP047",  # pydantic generic helpers read better with TypeVar
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "PLR2004"]

[tool.mypy]
python_version = "3.12"
files = ["src/shahrzad"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["online: requires a real provider and network"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Field name .register. in .BookBrief.:UserWarning",
]

[tool.coverage.run]
source = ["shahrzad"]
