# Auto-glossary example: propose character/place/term equivalents during `shz analyze`.
# Copy to books/<slug>/config.yaml. Review proposals with `shz glossary review`
# and approve them with `shz glossary approve --min-confidence 0.90`.
glossary:
  mode: auto                    # off | provided | auto
  approval: auto                # auto approves proposals above the threshold
  auto_approve_min_confidence: 0.90

pipeline:
  cost_mode: standard
  analyze:
    brief_approval: auto

budget:
  max_usd: 10
